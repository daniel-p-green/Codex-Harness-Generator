model = "gpt-5.5"
model_reasoning_effort = "high"
model_verbosity = "medium"
approval_policy = "on-request"
default_permissions = "financial-modeling"

[agents]
max_threads = 4
max_depth = 1

[agents.reviewer]
description = "Reviews financial-modeling notes for assumptions, calculations, risk, uncertainty, and not-advice boundaries."
config_file = "agents/reviewer.toml"

[[skills.config]]
path = "../.agents/skills/health-check"
enabled = true

[permissions.financial-modeling]
description = "Workspace write access with sensitive files denied."
extends = ":workspace"

[permissions.financial-modeling.filesystem]
glob_scan_max_depth = 4

[permissions.financial-modeling.filesystem.":workspace_roots"]
"." = "write"
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/*secret*" = "deny"
"**/*token*" = "deny"
"**/*credential*" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"

[permissions.financial-modeling.network]
enabled = true
mode = "limited"

[permissions.financial-modeling.network.domains]
"developers.openai.com" = "allow"
"docs.github.com" = "allow"
