name: Codex Harness Evals

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: python -m pip install .

      - name: Check installable CLI
        run: python scripts/check_cli_install.py

      - name: Run eval gate
        run: |
          set -o pipefail
          python scripts/run_evals.py --json | tee eval-gate-${{ matrix.python-version }}.json

      - name: Upload eval gate payload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-gate-python-${{ matrix.python-version }}
          path: eval-gate-${{ matrix.python-version }}.json
          if-no-files-found: ignore
