model = "gpt-5.5"
model_reasoning_effort = "medium"
model_verbosity = "medium"
approval_policy = "on-request"
default_permissions = "multi-area-hub"

[agents]
max_threads = 6
max_depth = 1

[agents.reviewer]
description = "Reviews multi-area changes for routing, boundaries, tests, and security risks."
config_file = "agents/reviewer.toml"

[[skills.config]]
path = "../.agents/skills/health-check"
enabled = true

[permissions.multi-area-hub]
description = "Workspace write access with sensitive files denied."
extends = ":workspace"

[permissions.multi-area-hub.filesystem]
glob_scan_max_depth = 4

[permissions.multi-area-hub.filesystem.":workspace_roots"]
"." = "write"
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/*secret*" = "deny"
"**/*token*" = "deny"
"**/*credential*" = "deny"
"**/*.pem" = "deny"
"**/*.key" = "deny"

[permissions.multi-area-hub.network]
enabled = true
mode = "limited"

[permissions.multi-area-hub.network.domains]
"developers.openai.com" = "allow"
"docs.github.com" = "allow"

