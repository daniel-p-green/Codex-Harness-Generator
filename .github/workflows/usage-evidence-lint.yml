name: Usage Evidence Lint

on:
  issues:
    types:
      - opened
      - edited
      - labeled
  issue_comment:
    types:
      - created
      - edited
  workflow_dispatch:
    inputs:
      issue:
        description: GitHub issue number or URL to lint, or all-open-pilots
        required: true

permissions:
  contents: read
  issues: write

jobs:
  lint:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.pull_request == null &&
        (
          github.event_name == 'issues' ||
          (github.event_name == 'issue_comment' && !contains(github.event.comment.body, '<!-- codex-harness-usage-lint -->'))
        ) &&
        (
          startsWith(github.event.issue.title, 'External usage pilot:') ||
          startsWith(github.event.issue.title, '[usage]') ||
          contains(github.event.issue.labels.*.name, 'usage-evidence')
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: python -m pip install .

      - name: Lint usage evidence
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_ISSUE: ${{ inputs.issue }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
        run: |
          set +e
          ISSUE_SELECTOR="$EVENT_ISSUE"
          if [ -z "$ISSUE_SELECTOR" ]; then
            ISSUE_SELECTOR="$WORKFLOW_ISSUE"
          fi
          mkdir -p usage-lint-results
          : > usage-lint-results/issues.tsv

          if [ "$ISSUE_SELECTOR" = "all-open-pilots" ]; then
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --json number,title \
              --jq '.[] | select(.title | startswith("External usage pilot:")) | .number' \
              > usage-lint-results/open-pilot-issues.txt
            while IFS= read -r ISSUE_NUMBER; do
              [ -n "$ISSUE_NUMBER" ] || continue
              printf "%s\t%s\n" "$ISSUE_NUMBER" "$ISSUE_NUMBER" >> usage-lint-results/issues.tsv
            done < usage-lint-results/open-pilot-issues.txt
          else
            ISSUE_NUMBER="$ISSUE_SELECTOR"
            if [[ "$ISSUE_NUMBER" == https://github.com/* ]]; then
              ISSUE_NUMBER="${ISSUE_NUMBER##*/}"
            fi
            printf "%s\t%s\n" "$ISSUE_NUMBER" "$ISSUE_SELECTOR" >> usage-lint-results/issues.tsv
          fi

          while IFS=$'\t' read -r ISSUE_NUMBER ISSUE_SELECTOR; do
            [ -n "$ISSUE_NUMBER" ] || continue
            python scripts/codex_harness.py usage-from-github-issue "$ISSUE_SELECTOR" \
              --repo "$GITHUB_REPOSITORY" \
              --include-comments \
              --pilot-record-dir Docs/Environment/pilot-records \
              --pilot-board-report Docs/Environment/PILOT_BOARD.md \
              --lint-only \
              --json > "usage-lint-results/$ISSUE_NUMBER.json"
            echo "$?" > "usage-lint-results/$ISSUE_NUMBER.exit"
          done < usage-lint-results/issues.tsv
          exit 0

      - name: Format lint comment
        run: |
          while IFS=$'\t' read -r ISSUE_NUMBER ISSUE_SELECTOR; do
            [ -n "$ISSUE_NUMBER" ] || continue
            python scripts/format_usage_lint_comment.py \
              "usage-lint-results/$ISSUE_NUMBER.json" \
              --out "usage-lint-results/$ISSUE_NUMBER-comment.md"
          done < usage-lint-results/issues.tsv

      - name: Upsert lint comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS=$'\t' read -r ISSUE_NUMBER ISSUE_SELECTOR; do
            [ -n "$ISSUE_NUMBER" ] || continue
            COMMENT_ID="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
              --jq '.[] | select(.body | contains("<!-- codex-harness-usage-lint -->")) | .id' | tail -n 1)"
            if [ -n "$COMMENT_ID" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" \
                -f "body=$(cat "usage-lint-results/$ISSUE_NUMBER-comment.md")" >/dev/null
            else
              gh issue comment "$ISSUE_SELECTOR" \
                --repo "$GITHUB_REPOSITORY" \
                --body-file "usage-lint-results/$ISSUE_NUMBER-comment.md"
            fi
          done < usage-lint-results/issues.tsv

      - name: Upload lint payload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: usage-evidence-lint
          path: |
            usage-lint-results/
          if-no-files-found: ignore
