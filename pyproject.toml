[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-harness-generator"
version = "1.0.0"
description = "Generate and validate Codex-native project harnesses."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Daniel Green" }
]
keywords = ["codex", "agents", "harness", "openai", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/daniel-p-green/Codex-Harness-Generator"
Repository = "https://github.com/daniel-p-green/Codex-Harness-Generator"
Issues = "https://github.com/daniel-p-green/Codex-Harness-Generator/issues"

[project.scripts]
codex-harness = "scripts.codex_harness:main"

[tool.setuptools]
packages = ["scripts"]
