name: Codex Harness Evals

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check installable CLI
        run: python scripts/check_cli_install.py

      - name: Run eval gate
        run: python scripts/run_evals.py
